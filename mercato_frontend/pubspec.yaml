name: mercato_frontend
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  animate_do: ^5.1.0
  flutter_modern_animated_loader: ^0.0.1
  top_snackbar_flutter: ^3.4.0
  flutter_secure_storage: ^11.0.0
  shared_preferences: ^2.5.5
  dio: ^5.11.0
  socket_io_client: ^3.1.6
  image_picker: ^1.2.3
  video_player: ^2.9.2
  file_picker: ^12.2.0
  awesome_snackbar_content: ^0.1.8
  iconsax: ^0.0.8
  google_fonts: ^9.0.0
  flutter_animate: ^4.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/role/
    - assets/images/onboarding/
    - assets/images/splash/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"